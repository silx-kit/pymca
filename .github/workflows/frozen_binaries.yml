# This is a basic workflow to help you get started with Actions

name: Manual bundle

# Controls when the action will run.
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  PROJECT: Pymca_release_test
  PROJECT_LOWER: pymca_release_test
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
# Fat binaries

  windows_pyinstaller_python39: #also works with cp311 and pyside6
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest ]
        python-version: [ "3.11" ]

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install qtconsole==5.4.1
          pip install matplotlib
          pip install --pre --extra-index-url https://test.pypi.org/simple/ --trusted-host test.pypi.org --only-binary Pymca_release_test Pymca_release_test
          pip install Cython
          pip install wheel
          pip install numpy
          pip install PySide6
          pip install h5py
          pip install fisx
          pip install hdf5plugin
          pip install silx
          pip install PyOpenGL
          pip install PyInstaller
          pip install git+https://github.com/vasole/bcflight.git

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build with PyInstaller
        run:
          python build-pyinstaller.py

      - name: Run the app to check it launches (Windows PowerShell)
        shell: pwsh
        run: |      
          #find exe (naming of folder with version)
          $exePath = Get-ChildItem -Path "dist" -Filter "PyMcaMain.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($null -eq $exePath) {
              Write-Error "Executable not found."
              exit 1
          }
          
          # Start the app as a background job
          $process = Start-Process -FilePath $exePath -PassThru
      
          Write-Host "App started with PID $($process.Id)"
      
          $timeoutSeconds = 120
          $stopWatch = [System.Diagnostics.Stopwatch]::StartNew()
      
          while (-not $process.HasExited -and $stopWatch.Elapsed.TotalSeconds -lt $timeoutSeconds) {
            Start-Sleep -Seconds 1
          }
      
          if (-not $process.HasExited) {
            Write-Host "App ran for $timeoutSeconds seconds without crashing. Killing it now..."
            try {
              $process.Kill()
              $process.WaitForExit()
            }
            catch {
              Write-Warning "Failed to kill the process: $_"
            }
            Write-Host "App test complete."
            exit 0
          }
          else {
            # Process exited early — check exit code
            $exitCode = $process.ExitCode
            if ($exitCode -ne 0) {
              Write-Error "App exited with error code $exitCode"
              exit $exitCode
            }
            else {
              Write-Error "App exited cleanly before $timeoutSeconds seconds, marking as failure."
              exit 1
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable-pyinstaller
          path: dist/PyMca*/**

  windows_cxfreeze_python39:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest ]
        python-version: [ "3.9" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install numpy==1.24.4
          pip install PyQt5
          pip install h5py
          pip install fisx
          pip install matplotlib==3.5.3
          pip install hdf5plugin
          pip install git+https://github.com/silx-kit/silx.git
          pip install PyOpenGL
          pip install qtconsole==5.4.1
          pip install lief==0.12.3
          pip install cx_Freeze==6.14.7
          pip install --pre --extra-index-url https://test.pypi.org/simple/ --trusted-host test.pypi.org --only-binary Pymca_release_test Pymca_release_test
          pip install Cython
          pip install wheel
          pip install git+https://github.com/vasole/bcflight.git

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build with cx_Freeze
        shell: cmd
        run:
          python build-cxfreeze.py

      - name: Print dist* directories content with PowerShell
        shell: pwsh
        run: |
          Get-ChildItem -Directory -Name dist* | ForEach-Object {
            Write-Host "Contents of $_ :"
            Get-ChildItem -Path $_ -Recurse
          }

      - name: Install PyMca from installer
        shell: pwsh
        run: |
          # Find the installer
          $installer = Get-Item dist\pymca*.exe
          if (-not $installer) {
            Write-Error "Installer not found in dist/"
            exit 1
          }
          # Run installer silently (adjust /S as needed)
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait

      - name: Run the installed app to check it launches
        shell: pwsh
        run: |
          # Define expected install path
          $basePath = "$env:ProgramFiles*"
          
          #find exe (naming of folder with version)
          $appPath = Get-ChildItem -Path $basePath -Filter "PyMcaMain.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($null -eq $appPath) {
              Write-Error "Executable not found."
              exit 1
          }
          
          if (-not (Test-Path $appPath)) {
            Write-Error "App was not installed to expected path: $appPath"
            exit 1
          }
      
          Write-Host "Launching installed PyMcaMain..."
      
          # Launch app and monitor
          $process = Start-Process -FilePath $appPath -PassThru
          Write-Host "App started with PID $($process.Id)"
      
          $timeoutSeconds = 120
          $stopWatch = [System.Diagnostics.Stopwatch]::StartNew()
      
          while (-not $process.HasExited -and $stopWatch.Elapsed.TotalSeconds -lt $timeoutSeconds) {
            Start-Sleep -Seconds 1
          }
      
          if (-not $process.HasExited) {
            Write-Host "App ran for $timeoutSeconds seconds without crashing. Killing it now..."
            try {
              $process.Kill()
              $process.WaitForExit()
            } catch {
              Write-Warning "Failed to kill the process: $_"
            }
            Write-Host "App test complete."
            exit 0
          } else {
            $exitCode = $process.ExitCode
            if ($exitCode -ne 0) {
              Write-Error "App exited with error code $exitCode"
              exit $exitCode
            } else {
              Write-Error "App exited cleanly before $timeoutSeconds seconds, marking as failure."
              exit 1
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-cxfreeze
          path: dist/*

### MacOs

  macos11_pyinstaller_python312:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set environment for 10.9 compatibility
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.9" >> $GITHUB_ENV
          echo "CFLAGS=-mmacosx-version-min=10.9" >> $GITHUB_ENV
          echo "LDFLAGS=-mmacosx-version-min=10.9" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install "setuptools<81"
          pip install --no-cache --trusted-host www.silx.org http://www.silx.org/pub/wheelhouse/universal2/numpy-1.26.2-cp312-cp312-macosx_10_9_universal2.whl
          pip install --no-cache --trusted-host www.silx.org http://www.silx.org/pub/wheelhouse/universal2/h5py-3.10.0-cp312-cp312-macosx_11_0_universal2.whl
          pip install --no-cache --trusted-host www.silx.org http://www.silx.org/pub/wheelhouse/universal2/psutil-5.9.6-cp312-abi3-macosx_10_9_universal2.whl
          pip install --no-cache --trusted-host www.silx.org http://www.silx.org/pub/wheelhouse/universal2/Pillow-10.1.0-cp312-cp312-macosx_11_0_universal2.whl
          pip install --no-cache --trusted-host www.silx.org http://www.silx.org/pub/wheelhouse/universal2/tornado-6.3.3-cp38-abi3-macosx_10_9_universal2.whl
          pip install --no-cache --trusted-host www.silx.org http://www.silx.org/pub/wheelhouse/universal2/contourpy-1.2.0-cp312-cp312-macosx_11_0_universal2.whl
          pip install --no-cache --trusted-host www.silx.org http://www.silx.org/pub/wheelhouse/universal2/kiwisolver-1.4.5-cp312-cp312-macosx_11_0_universal2.whl
          pip install cycler==0.12.1
          pip install fonttools==4.45.1
          pip install packaging==23.2
          pip install pyparsing==3.1.1
          pip install python_dateutil==2.8.2
          pip install --no-cache --trusted-host www.silx.org http://www.silx.org/pub/wheelhouse/universal2/matplotlib-3.8.2-cp312-cp312-macosx_11_0_universal2.whl
          pip install h5py
          pip install hdf5plugin
          pip install PySide6==6.6.0
          pip install lxml==4.9.3
          pip install --no-cache --trusted-host www.silx.org http://www.silx.org/pub/wheelhouse/universal2/fabio-2023.10.0-cp312-cp312-macosx_10_9_universal2.whl
          pip install fisx
          pip install git+https://github.com/silx-kit/silx.git
          pip install PyOpenGL
          pip install qtconsole==5.5.1
          pip install PyInstaller==6.2.0
          pip install Cython
          pip install wheel
          pip install --pre --index-url https://test.pypi.org/simple/ --trusted-host test.pypi.org --only-binary Pymca_release_test Pymca_release_test
          pip install git+https://github.com/vasole/bcflight.git

      - name: Build with PyInstaller (universal2)
        run: |
          python build-pyinstaller.py universal2
          ls dist
          find dist/ -type f -perm +111 | while read -r file; do
            version=$(otool -l "$file" 2>/dev/null | awk '/LC_VERSION_MIN_MACOSX/ {show=1} show && /version / {print $2; show=0}' | head -n 1)
            if [ -n "$version" ]; then
              echo "$version  <-  $file"
            fi
          done | sort

      ### correct and test app file

      - name: Move .app to /Applications
        run: |
          sudo mv ./dist/PyMca5.9.4.app /Applications/
          ls -l /Applications/PyMca5.9.4.app/Contents/MacOS

      - name: Make main binary executable
        run: chmod +x /Applications/PyMca5.9.4.app/Contents/MacOS/PyMcaMain

      - name: Rename __dot__dylibs folders to .dylibs
        run: |
          find /Applications/PyMca5.9.4.app -depth -type d -name '__dot__dylibs' | while IFS= read -r dir; do
            parent_dir=$(dirname "$dir")
            target="$parent_dir/.dylibs"

            if [ -e "$target" ]; then
              echo "⚠️ Skipping: $target already exists."
            else
              mv "$dir" "$target"
              if [ -d "$target" ]; then
                if [ "$(ls -A "$target")" ]; then
                  echo "✅ Renamed and verified: $dir → $target (not empty)"
                else
                  echo "⚠️ Renamed: $dir → $target but it's empty"
                fi
              else
                echo "❌ Rename failed: $dir → $target does not exist"
              fi
            fi
          done

      - name: Run the app to check it launches
        run: |
          set -e

          echo "Launching PyMcaMain..."

          # Start the app in the background
          /Applications/PyMca5.9.4.app/Contents/MacOS/PyMcaMain &
          APP_PID=$!

          echo "App started with PID $APP_PID"

          # Wait up to 120 seconds for it to crash or hang
          for i in {1..120}; do
            if ! ps -p $APP_PID > /dev/null; then
              echo "App exited early. Checking exit code..."
              wait $APP_PID
              EXIT_CODE=$?
              if [ $EXIT_CODE -ne 0 ]; then
                echo "App exited with error code $EXIT_CODE"
                exit $EXIT_CODE
              else
                echo "App exited cleanly before 2 minutes."
                exit 1
              fi
            fi
            sleep 1
          done

          echo "App ran for 2 minutes without crashing. Killing it now..."
          kill $APP_PID || true
          wait $APP_PID || true
          echo "App test complete."

      - name: Copy .app out /Applications
        run: |
          sudo mkdir -p myappfolder
          sudo cp -R "/Applications/PyMca5.9.4.app" myappfolder/

      - name: Cleanup
        run: |
          sudo rm -rf /Applications/PyMca5.9.4.app

      ### dmg test

      - name: Mount the DMG
        run: |
          hdiutil attach dist/PyMca5.9.4.dmg -mountpoint /Volumes/PyMcaApp

      - name: Copy .app to /Applications
        run: |
          sudo cp -R "/Volumes/PyMcaApp/PyMca5.9.4.app" /Applications/

      - name: Make main binary executable
        run: chmod +x /Applications/PyMca5.9.4.app/Contents/MacOS/PyMcaMain

      - name: Run the app to check it launches
        run: |
          set -e

          echo "Launching PyMcaMain..."

          # Start the app in the background
          /Applications/PyMca5.9.4.app/Contents/MacOS/PyMcaMain &
          APP_PID=$!

          echo "App started with PID $APP_PID"

          # Wait up to 120 seconds for it to crash or hang
          for i in {1..120}; do
            if ! ps -p $APP_PID > /dev/null; then
              echo "App exited early. Checking exit code..."
              wait $APP_PID
              EXIT_CODE=$?
              if [ $EXIT_CODE -ne 0 ]; then
                echo "App exited with error code $EXIT_CODE"
                exit $EXIT_CODE
              else
                echo "App exited cleanly before 2 minutes."
                exit 0
              fi
            fi
            sleep 1
          done

          echo "App ran for 5 minutes without crashing. Killing it now..."
          kill $APP_PID || true
          wait $APP_PID || true
          echo "App test complete."

      - name: Cleanup
        run: |
          sudo rm -rf /Applications/PyMca5.9.4.app

      # upload .dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-pyinstaller-artifacts-dmg
          path: dist/*.dmg
          retention-days: 1

      # upload .app as well
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-pyinstaller-artifacts-dashdotfix
          path: myappfolder/*
          include-hidden-files: true
          retention-days: 1