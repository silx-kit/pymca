# This is a basic workflow to help you get started with Actions

name: Windows (pyinstaller - simple executable)

# Controls when the action will run.
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:

env:
  PROJECT: Pymca_release_test
  PROJECT_LOWER: pymca_release_test
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
# Fat binaries

  windows_pyinstaller_python39: #also works with cp311 and pyside6 as well as oldest cp39 pyqt5
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest ]
        python-version: [ "3.11" ]

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install qtconsole==5.4.1
          pip install matplotlib
          pip install --pre --extra-index-url https://test.pypi.org/simple/ --trusted-host test.pypi.org --only-binary Pymca_release_test Pymca_release_test
          pip install Cython
          pip install wheel
          pip install numpy
          pip install PySide6
          pip install h5py
          pip install fisx
          pip install hdf5plugin
          pip install silx
          pip install PyOpenGL
          pip install PyInstaller
          pip install git+https://github.com/vasole/bcflight.git

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build with PyInstaller
        run:
          python build-pyinstaller.py

      - name: Run the app to check it launches (Windows PowerShell)
        shell: pwsh
        run: |      
          # Find the exe (naming have version)
          $exePath = Get-ChildItem -Path "dist" -Filter "PyMcaMain.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($null -eq $exePath) {
              Write-Error "Executable not found."
              exit 1
          }
          Write-Host "Found executable at $exePath"
          
          # Start the app as a background job
          $process = Start-Process -FilePath $exePath -PassThru
      
          Write-Host "App started with PID $($process.Id)"
      
          $timeoutSeconds = 120
          $stopWatch = [System.Diagnostics.Stopwatch]::StartNew()
      
          while (-not $process.HasExited -and $stopWatch.Elapsed.TotalSeconds -lt $timeoutSeconds) {
            Start-Sleep -Seconds 1
          }
      
          if (-not $process.HasExited) {
            Write-Host "App ran for $timeoutSeconds seconds without crashing. Killing it now..."
            try {
              $process.Kill()
              $process.WaitForExit()
            }
            catch {
              Write-Warning "Failed to kill the process: $_"
            }
            Write-Host "App test complete."
            exit 0
          }
          else {
            # Process exited early — check exit code
            $exitCode = $process.ExitCode
            if ($exitCode -ne 0) {
              Write-Error "App exited with error code $exitCode"
              exit $exitCode
            }
            else {
              Write-Error "App exited cleanly before $timeoutSeconds seconds, marking as failure."
              exit 1
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable-pyinstaller
          path: dist/PyMca*/**
          retention-days: 1
